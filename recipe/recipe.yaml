context:
  version: "0.6.1"

package:
  name: spaday-webawesome
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/32/c1/53116bbe499dd5c93d496fb5921666380dfdccb3f9bf8529ddc45caca111/spaday_webawesome-${{ version }}.tar.gz
  sha256: 778265547abc4aa4e5dc53c715ac04c424dc2c74619957f62b8168b1c7365ef9

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - pydantic >=2
    - spaday >=0.11.3,<1.0

tests:
  - python:
      imports:
        - spaday_webawesome
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Typed WebAwesome components and browser assets for spaday
  homepage: https://github.com/1kbgz/spaday-webawesome
  repository: https://github.com/1kbgz/spaday-webawesome

extra:
  recipe-maintainers:
    - timkpaine

context:
  version: "0.6.0"

package:
  name: spaday-webawesome
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/6f/d8/3459122e13fdc1c932c5ee3c58c46f8b76cfd01028e21448ad3459fb9f2b/spaday_webawesome-${{ version }}.tar.gz
  sha256: 17e221e58cb93fbddcf84caa2c303cff10bd52a7debf4202f8cd832f2c1a6645

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - pydantic >=2
    - spaday >=0.11.3,<1.0

tests:
  - python:
      imports:
        - spaday_webawesome
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Typed WebAwesome components and browser assets for spaday
  homepage: https://github.com/1kbgz/spaday-webawesome
  repository: https://github.com/1kbgz/spaday-webawesome

extra:
  recipe-maintainers:
    - timkpaine

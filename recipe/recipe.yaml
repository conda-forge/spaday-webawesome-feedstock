context:
  version: "0.5.0"
  python_min: "3.11"

package:
  name: spaday-webawesome
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/ed/02/fca0c62924395262bf08a8de515927678d38be2f61dc7d7b61ea0b6fb853/spaday_webawesome-${{ version }}.tar.gz
  sha256: 2b1c7f7f7941125221a2a266ce329f435f51161dab7d2733d74a08555e54d694

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - pydantic >=2
    - spaday >=0.8.2,<1.0

tests:
  - python:
      imports:
        - spaday_webawesome
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Typed WebAwesome components and browser assets for spaday
  homepage: https://github.com/1kbgz/spaday-webawesome
  repository: https://github.com/1kbgz/spaday-webawesome

extra:
  recipe-maintainers:
    - timkpaine

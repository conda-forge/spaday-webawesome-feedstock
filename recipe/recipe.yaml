context:
  version: "0.6.2"

package:
  name: spaday-webawesome
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/d4/2c/ce93aebc7da17d39b1bbdb21cf22ab1b899a2be1b640bc1fc7770df5ed36/spaday_webawesome-${{ version }}.tar.gz
  sha256: 8db0feb25ba9d5139d8538efd277ebab536c709e56622afcc530e7bd42b04d62

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - pydantic >=2
    - spaday >=0.11.3,<1.0

tests:
  - python:
      imports:
        - spaday_webawesome
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Typed WebAwesome components and browser assets for spaday
  homepage: https://github.com/1kbgz/spaday-webawesome
  repository: https://github.com/1kbgz/spaday-webawesome

extra:
  recipe-maintainers:
    - timkpaine
